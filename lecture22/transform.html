<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D transforms</title>
    <style>
        .box{
            width: 400px;
            height: 400px;
            background-color: pink;
            border:2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            transition: all 3s linear 1s ;
             
        }
        p{
           font-style: italic;
           font-size: 20px;
        }
        .box:hover{
            /* transform: rotate(45deg); */
            /* transform: scale(2); */
            /* transform: scale(0.5); */
            /* transform: skew(45deg); */
            transform: translate(0px,500px);


        }
        .container{
            width: 100vh;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
   <div class="container">
     <div class="box">
        <p>This is codehelp box</p>

    </div>
   </div>
    
</body>
</html>
