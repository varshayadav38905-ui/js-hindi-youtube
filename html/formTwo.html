<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form3</title>
</head>
<body>
    <h1>Complex Form</h1>
    <fieldset>
        <legend>Personal Information</legend>
        <label for="name">Name:</label>
        <input type="text" name="Name" id="name">
    
        <label for="email">EmailID:</label> 
        <input type="email" name="email" id="email">
        
        <label for="phone">PhoneNo:</label>
        <input type="tel" name="phone" id="phone">
    
        <label for="DOB">Date Of Birth</label>
        <input type="date" name="DoB" id="DOB">


        <span>gender:</span>
       
        <input type="radio"name="gender" id="radio1" value="male" >
        <label for="radio1">Male</label>
        
        <input type="radio"name="gender" id="radio2" value="Female" >
        <label for="radio2">Female</label>


         <label for="country">Country</label>
        <select name="country" id="country">
            <option value="India">India</option>
            <option value="us">United States</option>
        </select>

    </fieldset>

    <fieldset>
        <legend>Address Street</legend>

        <label for="cityname">city:</label>
        <input type="text" name="cityName" id="cityname">

        <label for="Statename">State:</label>
        <input type="text" name="StateName" id="Statename">

        <label for="zipcode">Zip Code:</label>
        <input type="text" name="zipcode" id="zipcode">

    </fieldset>

    <fieldset>
        <legend>Other Information</legend>

        <label for="Comments">Comments:</label>
        <textarea name="comments" id="Comments" rows="10" cols="30"></textarea>

        <label for="checkbox1">i agree to the terms of service</label>
        <input type="checkbox" name="checkbox1" id="checkBox1">
    
    </fieldset>
    <button>submit</button>
    
</body>
</html>
