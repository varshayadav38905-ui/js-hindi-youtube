<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Chai aur Code</title>
</head>
<body style="background-color: black; color: beige;">

</body>
    

 <script>
    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() *10 + 1)  // ese hi random id leli koi
    div.setAttribute("title", "generate a title") //random attributes 
    div.style.backgroundColor = "green"
    div.style.padding = "12px" //we have to attach it with the page
    div.innerText = " chai aur code" //take the referance and then overwrite
    const addText = document.createTextNode("chai aur code")  //preferred
    div.appendChild(addText)
    document.body.appendChild(div)  


 </script>

</html>
